<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d19">
<title>Somewhere, Elsewhere</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=Silkscreen:wght@400;700&display=swap');
  :root { --white:#e8e8df; --dim:#969b9c; --gold:#f5d77b; --blue:#9ecbd4; }
  * { box-sizing:border-box; }
  html,body { width:100%;height:100%;margin:0;overflow:hidden; }
  body {
    background:#101820;color:var(--white);font-family:'VT323',monospace;
    display:grid;place-items:center;image-rendering:pixelated;
    user-select:none;
  }
  #stars { display:none; }
  .world { display:none; }
  .title-screen {
    position:relative;z-index:1;width:min(1050px,96vw);height:min(720px,94vh);
    display:grid;grid-template-columns:1fr 300px;align-items:center;gap:30px;padding:45px 6%;
  }
  .art { position:relative;height:100%;display:flex;align-items:center;justify-content:center; }
  .title-block { position:relative;top:auto;left:auto;z-index:2;margin-top:-30px; }
  h1 { margin:0;font-family:'Silkscreen',monospace;font-size:clamp(27px,4.2vw,52px);font-weight:400;line-height:1.4;
    letter-spacing:-.08em;color:#e6e5dc;text-shadow:4px 4px 0 #38454a; }
  h1 span { display:block;color:#b6d1d2;margin-left:36px; }
  .subtitle { color:#88989b;font-size:18px;letter-spacing:.12em;margin:14px 0 0 5px; }

  .menu {
    align-self:center;justify-self:end;width:100%;max-width:280px;padding:20px 0;
    background:transparent;border:0;
  }
  .menu-heading { color:#77878b;font-size:17px;letter-spacing:.18em;margin:0 0 18px 27px; }
  .menu-list { display:flex;flex-direction:column;gap:5px; }
  .menu button {
    all:unset;display:flex;align-items:center;min-height:42px;padding:2px 10px 2px 0;
    color:#aeb7b5;font:26px 'VT323',monospace;letter-spacing:.03em;cursor:default;
    pointer-events:none;
  }
  .menu button .marker { display:inline-block;width:27px;color:transparent;font-size:25px; }
  .menu button.selected { color:#fff; }
  .menu button.selected .marker { color:var(--gold); }
  .menu button:focus { outline:none; }
  .menu-note { margin:23px 0 0 27px;color:#6f7c7d;font-size:16px;line-height:1.5; }
  .footer { position:fixed;z-index:2;left:22px;right:22px;bottom:14px;display:flex;justify-content:space-between;
    color:#59666a;font-size:15px;letter-spacing:.04em;pointer-events:none; }
  .dialog-backdrop { position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.72);display:none;place-items:center;padding:20px; }
  .dialog-backdrop.open { display:grid; }
  .dialog { width:min(440px,100%);padding:24px 28px;background:#11191d;border:2px solid #59696a;box-shadow:7px 7px 0 #050708; }
  .dialog h2 { font:30px 'VT323',monospace;color:var(--gold);margin:0 0 10px; }
  .dialog p { font:20px 'VT323',monospace;line-height:1.35;color:#c5ccca;margin:8px 0; }
  .dialog .actions { display:flex;justify-content:flex-end;gap:12px;margin-top:22px; }
  .dialog button { all:unset;font:21px 'VT323',monospace;color:#899496;padding:4px 10px;cursor:default; }
  .dialog button.selected { color:var(--gold); }
  .dialog button .marker { display:inline-block;width:17px;color:transparent; }
  .dialog button.selected .marker { color:var(--gold); }
  .volume-row { display:flex;align-items:center;gap:12px;font:20px 'VT323',monospace;color:#c5ccca; }
  input[type=range] { accent-color:var(--gold);width:140px; }
  @media(max-width:720px) {
    .title-screen { height:100vh;grid-template-columns:1fr;grid-template-rows:1fr auto;gap:0;padding:25px 8% 58px; }
    .art { min-height:0; }
    .title-block { top:7%;left:2%; }
    h1 { font-size:clamp(28px,8vw,45px); }
    .pixel-scene { bottom:2%;height:48%; }
    .moon { width:75px;height:75px;right:14%; }
    .menu { justify-self:center;max-width:300px;padding:0; }
    .menu-heading { margin-bottom:8px; }
    .menu button { min-height:35px;font-size:24px; }
    .menu-note { margin-top:10px; }
    .footer { font-size:12px;bottom:8px;left:10px;right:10px; }
  }
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="horizon" aria-hidden="true"></div>

<main class="title-screen">
  <section class="art" aria-label="Somewhere, Elsewhere title artwork">
    <div class="title-block">
      <h1>Somewhere,<span>Elsewhere</span></h1>
      <p class="subtitle">A story waiting in the dark.</p>
    </div>

  </section>
  <nav class="menu" aria-label="Main menu">
    <p class="menu-heading">MAIN MENU</p>
    <div class="menu-list">
      <button class="selected" data-dialog="new"><span class="marker">▶</span>New Game</button>
      <button data-dialog="continue"><span class="marker">▶</span>Continue</button>
      <button data-dialog="settings"><span class="marker">▶</span>Options</button>
      <button data-dialog="about"><span class="marker">▶</span>About</button>
      <button data-dialog="quit"><span class="marker">▶</span>Quit</button>
    </div>
    <p class="menu-note">Z / ENTER — Confirm<br>X / ESC — Back</p>
  </nav>
</main>
<div class="footer"><span>SOMEWHERE, ELSEWHERE</span><span>v0.0.1</span></div>

<div class="version">SOMEWHERE, ELSEWHERE&nbsp; · &nbsp;PRE-ALPHA</div>
<div class="hint">↑ ↓ TO SELECT &nbsp;·&nbsp; ENTER TO OPEN</div>

<div class="dialog-backdrop" id="dialogBackdrop" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
  <div class="dialog">
    <h2 id="dialogTitle">A quiet moment</h2>
    <div id="dialogBody"></div>
    <div class="actions"><button id="closeDialog"><span class="marker">▶</span>BACK</button><button id="dialogConfirm"><span class="marker">▶</span>OK</button></div>
  </div>
</div>

<script>
(() => {
  const buttons=[...document.querySelectorAll('.menu button')];
  const backdrop=document.getElementById('dialogBackdrop');
  const title=document.getElementById('dialogTitle');
  const body=document.getElementById('dialogBody');
  const backButton=document.getElementById('closeDialog');
  const okButton=document.getElementById('dialogConfirm');
  let selected=0, dialogOpen=false, dialogSelected=1;

  function selectMenu(index) {
    selected=(index+buttons.length)%buttons.length;
    buttons.forEach((button,i)=>button.classList.toggle('selected',i===selected));
  }
  function selectDialog(index) {
    dialogSelected=(index+2)%2;
    backButton.classList.toggle('selected',dialogSelected===0);
    okButton.classList.toggle('selected',dialogSelected===1);
  }
  function closeDialog() {
    backdrop.classList.remove('open');
    dialogOpen=false;
    selectMenu(selected);
  }
  function openDialog(kind) {
    const messages={
      new:['Not yet', '<p>This is a menu preview. The journey will begin in a future update.</p>'],
      continue:['No save data', '<p>There is no saved game to continue.</p>'],
      about:['Somewhere, Elsewhere', '<p>A quiet, story-driven adventure about a small traveler, a strange world, and the light they carry.</p><p>Inspired by the feeling of discovering a world that seems to notice you.</p>'],
      quit:['Not so fast', '<p>There is nowhere to go just yet. Thanks for playing this little preview.</p>']
    };
    if(kind==='settings') {
      title.textContent='Options';
      body.innerHTML='<div class="volume-row"><label for="volume">Volume</label><input id="volume" type="range" min="0" max="100" value="70"><span id="volumeValue">70</span></div><p>Audio options will be available in a future update.</p>';
      const slider=document.getElementById('volume');
      slider.addEventListener('input',()=>document.getElementById('volumeValue').textContent=slider.value);
    } else {
      title.textContent=messages[kind][0];
      body.innerHTML=messages[kind][1];
    }
    backdrop.classList.add('open');
    dialogOpen=true;
    selectDialog(1);
  }
  function activateMenu() { openDialog(buttons[selected].dataset.dialog); }
  function activateDialog() {
    // Both choices currently dismiss this informational preview dialog.
    closeDialog();
  }

  // Intentionally keyboard-only: pointer events never activate or select menu options.
  document.addEventListener('mousedown',e=>e.preventDefault());
  document.addEventListener('click',e=>e.preventDefault());
  document.addEventListener('keydown',e=>{
    const key=e.key;
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' ','Escape','Backspace','z','Z','x','X'].includes(key)) e.preventDefault();

    if(dialogOpen) {
      if(key==='ArrowUp'||key==='ArrowDown'||key==='ArrowLeft'||key==='ArrowRight') {
        selectDialog(dialogSelected===0?1:0);
      } else if(key==='Enter'||key===' '||key==='z'||key==='Z') {
        activateDialog();
      } else if(key==='Escape'||key==='Backspace'||key==='x'||key==='X') {
        closeDialog();
      }
      return;
    }

    if(key==='ArrowDown'||key==='ArrowRight') selectMenu(selected+1);
    else if(key==='ArrowUp'||key==='ArrowLeft') selectMenu(selected-1);
    else if(key==='Enter'||key===' '||key==='z'||key==='Z') activateMenu();
  });
  selectMenu(0);
})();
</script>
</body>
</html>
